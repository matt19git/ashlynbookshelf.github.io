<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookshelf</title>
  <meta name="description" content="An interactive bookshelf — hover over a spine to preview its cover." />

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>

  <!-- ─── Spotify Embed (responsive) — replace PLAYLIST_ID when ready ─ -->
  <section class="spotify-embed" aria-label="Spotify playlist">
    <div class="spotify-embed__frame">
      <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/377wO33ymkYlVPkRmy4TP8?utm_source=generator&si=ac4af901587342b3" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
  </section>

  <!-- ─── Bookshelf ───────────────────────────────────────────────── -->
  <main class="bookshelf-wrapper">
    <div id="bookshelf-container" class="bookshelf-container">
      <img id="bookshelf-image" class="bookshelf-image" src="./assets/bookshelf.png" alt="Bookshelf photograph"
        draggable="false" />
      <!-- Hotspot overlays are injected here by app.js -->
    </div>
  </main>

  <!-- ─── Floating Cover Preview (hidden by default) ──────────────── -->
  <div id="cover-preview" class="cover-preview">
    <img src="" alt="" />
  </div>

  <!-- ─── Scripts (ES modules) ────────────────────────────────────── -->
  <script type="module" src="./src/app.js"></script>
  

</body>

</html>
